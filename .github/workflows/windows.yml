name: Windows

# Build do omapass para Windows x64, reaproveitado pelo CI (a cada PR, para
# que a compilação não quebre sem aviso) e pelo workflow de release (que
# anexa o zip). Compila com o MinGW do MSYS2 — o mesmo g++ e as mesmas
# bibliotecas (Qt 6, Botan 3, zlib) do Linux, sem um segundo conjunto de
# dependências para manter.
on:
  workflow_call:

jobs:
  windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libbotan
            mingw-w64-ucrt-x86_64-zlib

      - name: Compila
        run: |
          mkdir build
          cd build
          qmake6 ../omapass.pro
          mingw32-make -j"$(nproc)" release
          find . -name omapass.exe

      - name: Monta a pasta do pacote
        run: |
          versao="$(sed -n 's/.*applicationVersion = QStringLiteral("\([^"]*\)").*/\1/p' src/main.cpp)"
          pasta="omapass-$versao-windows-x64"
          exe="$(find build -name omapass.exe | head -n 1)"
          mkdir -p "dist/$pasta"
          cp "$exe" "dist/$pasta/"

          # Qt: plugins de plataforma, módulos QML e as DLLs do próprio Qt.
          deploy="$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)"
          "$deploy" --release --no-translations --qmldir src "dist/$pasta/omapass.exe"

          # O que o windeployqt não conhece (Botan, zlib, o runtime do MinGW)
          # e as dependências delas; só o que veio do MSYS2, nunca o sistema.
          ldd "dist/$pasta/omapass.exe" | awk '/ucrt64/ {print $3}' | while read -r dll; do
            cp -n "$dll" "dist/$pasta/"
          done

          # Sem isto o Qt deduz o prefixo de onde estão as DLLs (aqui, a
          # pasta acima) e procura plugins e módulos QML lá — não acha, e a
          # interface não abre. Com o qt.conf ele olha ao lado do executável.
          printf '[Paths]\nPrefix = .\nBinaries = .\nPlugins = .\nImports = qml\nQmlImports = qml\n' \
              > "dist/$pasta/qt.conf"

          cp -r wordlists "dist/$pasta/wordlists"
          cp LICENSE README.md "dist/$pasta/"
          echo "PASTA=$pasta" >> "$GITHUB_ENV"

      - name: Confere que o executável sobe
        run: |
          # Sem janela: só a versão, o que já exige que o Qt e as DLLs
          # estejam todos no lugar.
          "dist/$PASTA/omapass.exe" --version

      - name: Depuração - sem MSYS2, com e sem qt.conf
        shell: pwsh
        run: |
          $dir = (Resolve-Path "dist/$env:PASTA").Path
          # Como numa máquina limpa: nada do MSYS2 por perto.
          Rename-Item C:\msys64 C:\msys64_off
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Tentar($nome) {
              $p = Start-Process -FilePath "$dir\omapass.exe" -PassThru
              Start-Sleep -Seconds 10
              "[$nome] vivo: $(-not $p.HasExited)"
              if ($p.HasExited) { "[$nome] codigo de saida: $($p.ExitCode)" }
              else {
                  $p.Refresh()
                  "[$nome] janela: '$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
              }
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$dir\..\$nome.png")
              Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
          }
          Move-Item "$dir\qt.conf" "$dir\..\qt.conf.bak"
          Tentar "sem-qtconf"
          Move-Item "$dir\..\qt.conf.bak" "$dir\qt.conf"
          Tentar "com-qtconf"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-windows
          path: |
            dist/sem-qtconf.png
            dist/com-qtconf.png
          if-no-files-found: warn

      - name: Gera o zip
        run: |
          cd dist
          zip -qr "$PASTA.zip" "$PASTA"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: omapass-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
