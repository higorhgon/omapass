name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Arch é a plataforma alvo (Omarchy) e traz as versões que o omapass usa.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Instala as dependências
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git \
            qt6-base qt6-declarative qt6-tools \
            botan zlib \
            pass

      - uses: actions/checkout@v4

      - name: Testa
        run: ./bin/test

      - name: Compila
        run: ./bin/build

  # Ubuntu LTS, que ainda traz Botan 2: o omapass compila com as duas
  # versões, e é isto que garante que continue compilando.
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Instala as dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            qmake6 qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            libgl-dev libbotan-2-dev zlib1g-dev libxkbcommon-dev \
            pass

      - name: Testa
        run: ./bin/test

      - name: Compila
        run: ./bin/build

  # O mesmo build que o release publica, para que a compilação no Windows não
  # quebre sem aviso.
  windows:
    uses: ./.github/workflows/windows.yml
