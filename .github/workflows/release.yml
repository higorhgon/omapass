name: Release

# Disparado à mão: um release é entrega, não algo para sair a cada push.
# Compila o AppImage (Linux) e o zip (Windows) em paralelo e, só se os dois
# saírem, publica os arquivos numa release com um SHA256SUMS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (em branco usa v<versão do main.cpp>)"
        required: false
        type: string
      prerelease:
        description: "Marcar como pré-lançamento"
        required: false
        default: false
        type: boolean

# Necessário para criar a release e subir os arquivos nela.
permissions:
  contents: write

jobs:
  linux:
    # Fixo, não `latest`: o AppImage herda a glibc de onde foi gerado, e uma
    # troca silenciosa de runner reduziria em que máquinas ele roda.
    runs-on: ubuntu-24.04

    outputs:
      versao: ${{ steps.pacote.outputs.versao }}
      tag: ${{ steps.pacote.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # `make appimage` compila dentro do container Ubuntu LTS descrito em
      # packaging/appimage.Dockerfile — o mesmo caminho de quem gera na
      # própria máquina, então o arquivo publicado aqui é o que se obtém lá.
      - name: Gera o AppImage
        run: make appimage

      - name: Descobre a versão e o arquivo
        id: pacote
        # A tag entra pelo ambiente, não interpolada no meio do script: um
        # `${{ }}` de texto livre vira parte do shell antes de ele rodar.
        env:
          TAG_PEDIDA: ${{ inputs.tag }}
        run: |
          versao="$(sed -n 's/.*applicationVersion = QStringLiteral("\([^"]*\)").*/\1/p' src/main.cpp)"
          arquivo="dist/omapass-$versao-x86_64.AppImage"
          if [ ! -f "$arquivo" ]; then
            echo "O AppImage esperado nao apareceu em $arquivo. O que ha em dist/:" >&2
            ls -la dist/ >&2
            exit 1
          fi
          tag="$TAG_PEDIDA"
          [ -n "$tag" ] || tag="v$versao"
          {
            echo "versao=$versao"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: omapass-linux-x64
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    uses: ./.github/workflows/windows.yml

  publicar:
    needs: [linux, windows]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omapass-*-x64
          path: dist
          merge-multiple: true

      # Acompanha os arquivos: é a forma de quem baixa conferir que chegaram
      # inteiros.
      - name: Calcula o SHA256
        run: |
          cd dist
          ls -la
          sha256sum omapass-* > SHA256SUMS
          cat SHA256SUMS

      # `gh` já vem no runner, então nada de terceiros para publicar. Uma
      # release que já exista é reaproveitada, com os arquivos substituídos:
      # regerar os pacotes de uma versão é justamente o caso comum. A tag
      # nasce no commit que foi compilado, não no que a branch padrão for
      # depois.
      - name: Publica na release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.linux.outputs.tag }}
          VERSAO: ${{ needs.linux.outputs.versao }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "omapass $VERSAO" \
              --generate-notes \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi
