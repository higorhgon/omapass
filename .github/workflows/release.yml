name: Release

# Disparado manualmente para publicar uma versão.
# Gera o AppImage, os pacotes do Windows e o DMG do macOS Intel em paralelo.
# Publica os arquivos, o SHA256SUMS e a assinatura dele quando os três builds passarem.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (em branco usa v<versão do main.cpp>)"
        required: false
        type: string
      prerelease:
        description: "Marcar como pré-lançamento"
        required: false
        default: false
        type: boolean

# Necessário para criar a release e subir os arquivos nela.
permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/appimage.yml
    with:
      tag: ${{ inputs.tag }}

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml

  publicar:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omapass-*-x64
          path: dist
          merge-multiple: true

      # Acompanha os arquivos: é a forma de quem baixa conferir que chegaram
      # inteiros.
      - name: Calcula o SHA256
        run: |
          cd dist
          ls -la
          sha256sum omapass-* > SHA256SUMS
          cat SHA256SUMS

      # O app só instala uma atualização se o SHA256SUMS estiver assinado com
      # esta chave Ed25519; a pública correspondente está em src/updater.cpp.
      # A chave fica só no secret e num arquivo temporário apagado em seguida.
      - name: Assina o SHA256SUMS
        env:
          CHAVE: ${{ secrets.OMAPASS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::secret OMAPASS_UPDATE_SIGNING_KEY ausente"
            exit 1
          fi
          cd dist
          chave="$RUNNER_TEMP/chave.pem"
          trap 'rm -f "$chave"' EXIT
          (umask 077; printf '%s\n' "$CHAVE" > "$chave")
          openssl pkeyutl -sign -rawin -inkey "$chave" -in SHA256SUMS -out SHA256SUMS.sig
          test "$(stat -c %s SHA256SUMS.sig)" -eq 64

      # `gh` já vem no runner, então nada de terceiros para publicar. Uma
      # release que já exista é reaproveitada, com os arquivos substituídos:
      # regerar os pacotes de uma versão é justamente o caso comum. A tag
      # nasce no commit que foi compilado, não no que a branch padrão for
      # depois.
      - name: Publica na release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.linux.outputs.tag }}
          VERSAO: ${{ needs.linux.outputs.versao }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "omapass $VERSAO" \
              --generate-notes \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi
